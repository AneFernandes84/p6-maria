</main><script>
const DATA={"Matemática": {"icon": "📐", "color": "#7257d9", "lessons": [{"title": "M24 • Divisão e frações", "visual": "fraction", "steps": ["Maria, imagine 20 pedacinhos de chocolate. Uma fração também pode representar uma divisão.", "Na fração três quintos, o cinco de baixo diz em quantas partes iguais vamos separar.", "Então fazemos 20 dividido por 5. Cada grupo fica com 4 chocolates.", "O três de cima diz quantos grupos vamos pegar. Três grupos de 4 dão 12."], "hack": "Depois de entender: BAIXO separa, CIMA pega.", "example": "3/5 de 20 = 20 ÷ 5 × 3 = 12."}, {"title": "M25 • Fração, decimal e porcentagem", "visual": "percent", "steps": ["Agora vamos mudar a roupa do mesmo número. Metade pode aparecer de três jeitos.", "Um meio é a fração. Zero vírgula cinco é o decimal. Cinquenta por cento é a porcentagem.", "Porcentagem significa de cada cem. Por isso 50% é cinquenta de cem, que é metade."], "hack": "% = de cada 100.", "example": "3/4 = 0,75 = 75%."}, {"title": "M26 • Possibilidades e probabilidade", "visual": "prob", "steps": ["Se você tem 3 camisetas e 2 shorts, cada camiseta pode combinar com os dois shorts.", "Em vez de listar tudo, podemos multiplicar: 3 vezes 2 dá 6 combinações.", "Na probabilidade, comparamos casos favoráveis com todos os casos possíveis."], "hack": "Possibilidades em etapas: multiplique. Probabilidade: favoráveis ÷ total.", "example": "Dois dados: 6 × 6 = 36 pares ordenados."}, {"title": "M27 • Medidas, área e perímetro", "visual": "area", "steps": ["Comprimento mede uma dimensão. Na escala métrica, cada passo muda por 10.", "Área mede uma superfície. Como ela tem duas dimensões, cada passo muda por 100.", "Perímetro é a volta da figura. Área é o espaço de dentro."], "hack": "PERÍmetro passeia pela borda. ÁREA ocupa o chão.", "example": "Retângulo 9 m × 5 m: área 45 m²; perímetro 28 m."}], "qs": [["Quanto é 3/4 de 32?", ["8", "16", "24", "28"], 2, "Separe 32 em 4 grupos: 8 em cada. Pegue 3 grupos: 24."], ["Qual representa 1/2?", ["0,2 = 20%", "0,25 = 25%", "0,5 = 50%", "0,75 = 75%"], 2, "Metade é 0,5 e também 50%."], ["3 camisetas e 2 shorts formam quantas combinações?", ["5", "6", "8", "12"], 1, "Cada uma das 3 camisetas combina com 2 shorts: 3 × 2 = 6."], ["Dois dados de 6 faces geram quantos pares ordenados?", ["6", "12", "24", "36"], 3, "São 6 possibilidades no primeiro dado × 6 no segundo."], ["5 m equivalem a:", ["50 cm", "500 cm", "5.000 cm", "0,05 cm"], 1, "Cada metro tem 100 cm. Então 5 × 100 = 500 cm."], ["4 m² equivalem a:", ["400 cm²", "4.000 cm²", "40.000 cm²", "400.000 cm²"], 2, "m²→dm² ×100 e dm²→cm² ×100. Logo 4 × 10.000."], ["Retângulo 9 m × 5 m tem área de:", ["14 m²", "28 m²", "45 m²", "50 m²"], 2, "Área do retângulo = base × altura."], ["Qual afirmação é verdadeira?", ["Área e perímetro são sempre iguais", "Comprimento muda por 100 a cada passo", "Área mede superfície e perímetro mede contorno", "1 L = 100 mL"], 2, "Área é a superfície interna; perímetro é o contorno."]], "open": ["Explique com suas palavras por que, para calcular 3/5 de 20, primeiro dividimos por 5.", "Explique a diferença entre área e perímetro e crie um exemplo.", "Por que a conversão de área muda por 100 a cada etapa, enquanto comprimento muda por 10?"]}, "Matemática Essencial": {"icon": "➗", "color": "#3478b8", "lessons": [{"title": "Polígonos, perímetro e área", "visual": "polygon", "steps": ["Polígono é uma figura plana fechada formada por segmentos de reta.", "Para o perímetro, somamos todos os lados.", "Para a área de um retângulo, multiplicamos base pela altura."], "hack": "Perímetro = passeio na borda.", "example": "Quadrado lado 7 cm: P = 28 cm e A = 49 cm²."}], "qs": [["Quadrado de lado 7 cm tem perímetro:", ["14", "21", "28", "49"], 2, "São quatro lados de 7 cm: 4 × 7 = 28."], ["Retângulo 8 cm × 3 cm tem área:", ["11", "22", "24", "48"], 2, "8 × 3 = 24 cm²."], ["Qual figura é um polígono?", ["Círculo", "Figura fechada só com segmentos de reta", "Linha aberta", "Curva aberta"], 1, "Polígonos são fechados e formados por segmentos de reta."]], "open": ["Desenhe dois retângulos de mesma área e perímetros diferentes e mostre os cálculos."]}, "História": {"icon": "🏛️", "color": "#a45b35", "lessons": [{"title": "Roma • Monarquia e República", "visual": "rome", "steps": ["Roma passou tradicionalmente por Monarquia, República e Império.", "Na República, Senado e magistraturas tinham papel político.", "Patrícios eram famílias aristocráticas; plebeus lutaram por direitos políticos e sociais."], "hack": "Ordem: Monarquia → República → Império.", "example": "República vem de res publica, a coisa pública."}, {"title": "Expansão e Império", "visual": "rome2", "steps": ["As conquistas ampliaram o território romano pelo Mediterrâneo.", "A expansão trouxe riquezas, pessoas escravizadas e comércio, mas também tensões e desigualdades.", "No Império, o imperador concentrou grande poder."], "hack": "Expansão trouxe ganhos e também problemas.", "example": "Estradas e cidades ajudavam a integrar o vasto território."}, {"title": "Crise no Ocidente", "visual": "rome3", "steps": ["A crise do Império Romano do Ocidente não teve uma causa única.", "Problemas políticos, econômicos e militares se combinaram com pressões de povos germânicos.", "O ano 476 é tradicionalmente usado como marco do fim do Império Romano do Ocidente."], "hack": "Nada de causa mágica: pense em vários fatores juntos.", "example": "Crise interna + pressões externas = processo longo."}], "qs": [["Qual é a ordem tradicional das fases políticas de Roma?", ["Império, República, Monarquia", "Monarquia, República, Império", "República, Monarquia, Império", "Monarquia, Império, República"], 1, "Monarquia → República → Império."], ["Na República, famílias aristocráticas tradicionais eram:", ["Plebeus", "Patrícios", "Gladiadores", "Fenícios"], 1, "Os patrícios formavam a aristocracia tradicional."], ["A crise do Ocidente é melhor explicada por:", ["Uma batalha apenas", "Vários fatores políticos, econômicos e militares", "Somente o clima", "Decisão voluntária"], 1, "Foi um processo com múltiplos fatores."], ["476 é tradicionalmente associado a:", ["Fundação de Roma", "Início da República", "Fim do Império Romano do Ocidente", "Guerras Púnicas"], 2, "476 é usado como marco tradicional do fim do Império Romano do Ocidente."]], "open": ["Explique duas consequências da expansão romana.", "Por que a queda do Império Romano do Ocidente não deve ser explicada por uma única causa?"]}, "Ciências": {"icon": "🧠", "color": "#d14f72", "lessons": [{"title": "Sistema nervoso", "visual": "brain", "steps": ["O sistema nervoso central é formado pelo encéfalo e pela medula espinal.", "O sistema nervoso periférico inclui nervos e gânglios, conectando o corpo ao sistema central.", "Cérebro, cerebelo, hipotálamo e tronco encefálico exercem funções diferentes."], "hack": "SNC = central de comando. SNP = fios que ligam a central ao corpo.", "example": "O cerebelo participa do equilíbrio e da coordenação."}, {"title": "Aferente, eferente e reflexo", "visual": "reflex", "steps": ["Maria encostou em algo muito quente. Receptores da pele detectam o estímulo.", "A informação segue pelo nervo sensitivo, ou aferente, em direção ao sistema nervoso central.", "A medula pode organizar rapidamente a resposta reflexa.", "A ordem motora sai pelo nervo eferente e o músculo retira a mão."], "hack": "AFERENTE Aproxima do SNC. EFERENTE Escapa do SNC.", "example": "Estímulo → receptor → aferente → SNC → eferente → efetor → resposta."}, {"title": "Neurônios, sinapses e drogas", "visual": "neuron", "steps": ["Neurônios são células especializadas na transmissão de informações.", "A comunicação entre neurônios acontece em regiões chamadas sinapses.", "Substâncias como o álcool alteram o funcionamento do sistema nervoso e podem prejudicar reação, coordenação e julgamento."], "hack": "Sinapse = ponto de comunicação.", "example": "Alterar a comunicação nervosa pode deixar respostas mais lentas."}], "qs": [["O SNC é formado principalmente por:", ["Nervos e músculos", "Encéfalo e medula espinal", "Coração e encéfalo", "Ossos e gânglios"], 1, "Encéfalo e medula espinal formam o SNC."], ["O nervo aferente leva informação:", ["Do SNC ao músculo", "Dos receptores ao SNC", "Do coração ao pulmão", "Do osso à pele"], 1, "Aferente se aproxima do SNC."], ["No arco reflexo, uma resposta rápida pode ser organizada inicialmente pela:", ["Pele", "Medula espinal", "Articulação", "Corrente sanguínea"], 1, "A medula pode integrar rapidamente o arco reflexo."], ["Equilíbrio e coordenação têm forte participação do:", ["Cerebelo", "Estômago", "Rim", "Pâncreas"], 0, "O cerebelo participa do equilíbrio e coordenação."], ["Sinapse é:", ["Um osso", "Região de comunicação entre neurônios", "Um músculo", "Uma glândula"], 1, "Sinapses permitem comunicação entre células nervosas."]], "open": ["Descreva o caminho do estímulo até a resposta em um arco reflexo.", "Explique por que a mão pode começar a se afastar de algo quente antes da percepção consciente completa da dor."]}, "Português": {"icon": "✍️", "color": "#7857a8", "lessons": [{"title": "Narrativas ficcionais", "visual": "story", "steps": ["Narrativas apresentam acontecimentos organizados em um enredo.", "Narrador é quem conta; personagens vivem os acontecimentos.", "Tempo e espaço ajudam a situar a história, e o conflito movimenta a ação."], "hack": "Quem conta = narrador. Quem vive = personagem.", "example": "Procure no texto a pista que sustenta sua resposta."}, {"title": "História em quadrinhos", "visual": "comic", "steps": ["HQ mistura linguagem verbal e não verbal.", "Balões, expressões, enquadramentos e imagens também contam a história.", "Onomatopeias representam sons, como TOC TOC e BUM."], "hack": "Na HQ, leia palavras + imagens.", "example": "Um personagem dizendo 'Tudo bem!' com rosto triste pode criar contraste."}, {"title": "Linguagem jornalística", "visual": "news", "steps": ["A notícia procura informar um acontecimento.", "Título chama atenção para o assunto. O lide apresenta informações essenciais logo no início.", "Ao ler, procure: o quê, quem, quando, onde, como e por quê."], "hack": "Lide = resumo essencial logo no começo.", "example": "O lide não é espaço para inventar opinião pessoal."}], "qs": [["Quem conta uma narrativa é o:", ["Personagem principal", "Narrador", "Leitor", "Título"], 1, "Narrador é a voz que conta os acontecimentos."], ["'BUM!' é exemplo de:", ["Adjetivo", "Onomatopeia", "Pronome", "Artigo"], 1, "Onomatopeia representa um som."], ["O lide de uma notícia costuma trazer:", ["Só opinião", "Informações essenciais", "Só o nome do jornal", "Personagens fictícios"], 1, "O lide resume o essencial do acontecimento."], ["Em HQ, para compreender bem, devemos:", ["Ler só os balões", "Ignorar desenhos", "Combinar palavras e imagens", "Ler só o título"], 2, "A linguagem verbal e não verbal trabalham juntas."]], "open": ["Explique como a imagem pode completar ou mudar o sentido de uma fala em uma HQ.", "Crie um lide curto respondendo o quê, quem, quando e onde."]}, "Português Básico": {"icon": "🔤", "color": "#4978a8", "lessons": [{"title": "Explícito e inferência", "visual": "detective", "steps": ["Informação explícita é aquela que aparece diretamente no texto.", "Inferência é uma conclusão que fazemos usando pistas do texto.", "Inferir não é chutar. A resposta precisa ter evidência."], "hack": "Explícito: está escrito. Inferência: pistas + raciocínio.", "example": "Se o texto diz que Ana entrou encharcada segurando um guarda-chuva, podemos inferir que provavelmente chovia."}], "qs": [["Informação explícita é aquela que:", ["Está declarada no texto", "Depende só de opinião", "Não tem relação com o texto", "Está sempre escondida"], 0, "Explícita aparece diretamente no texto."], ["Uma boa inferência deve:", ["Ignorar o texto", "Ser apoiada por pistas", "Ser sempre opinião", "Contradizer o texto"], 1, "Inferências precisam de evidências do texto."]], "open": ["Explique a diferença entre informação explícita e inferência e dê um exemplo."]}, "Geografia": {"icon": "🌎", "color": "#37866b", "lessons": [{"title": "Vegetação e biodiversidade", "visual": "forest", "steps": ["A vegetação não é igual em todos os lugares.", "Clima, solo, relevo e disponibilidade de água ajudam a explicar diferentes formações vegetais.", "Biodiversidade é a variedade de formas de vida."], "hack": "Bio = vida; diversidade = variedade.", "example": "Ambientes quentes e úmidos podem sustentar grande biodiversidade."}, {"title": "Desmatamento", "visual": "deforest", "steps": ["Desmatamento é a retirada da cobertura vegetal.", "Ele pode causar perda de habitats, erosão do solo, alterações no ciclo da água e redução da biodiversidade.", "É importante separar causas de consequências."], "hack": "Sem cobertura vegetal, o solo fica mais exposto.", "example": "Perda de habitat é consequência; abertura de área pode ser uma causa do desmatamento."}], "qs": [["Biodiversidade significa:", ["Quantidade de chuva", "Variedade de formas de vida", "Altura das montanhas", "Número de cidades"], 1, "Bio = vida e diversidade = variedade."], ["Uma consequência do desmatamento é:", ["Mais habitats automaticamente", "Perda de habitats", "Fim da erosão", "Nova floresta imediata"], 1, "A retirada da vegetação pode destruir habitats."], ["O que influencia formações vegetais?", ["Clima, solo, relevo e água", "Só o idioma", "Só o trânsito", "Apenas relógios"], 0, "Esses fatores ambientais ajudam a explicar a vegetação."]], "open": ["Explique duas consequências ambientais do desmatamento.", "Por que climas diferentes podem apresentar vegetações diferentes?"]}, "Inglês": {"icon": "🇬🇧", "color": "#b84b4b", "lessons": [{"title": "Simple Past", "visual": "english", "steps": ["O Simple Past fala de ações concluídas no passado.", "Verbos regulares geralmente recebem ed. Verbos irregulares podem mudar de forma.", "Quando usamos did ou didn't, o verbo principal volta para a forma base."], "hack": "DID apareceu? O verbo principal volta ao normal.", "example": "She visited. Did she visit? She didn't visit."}, {"title": "Reading clues", "visual": "reading", "steps": ["Não tente traduzir cada palavra primeiro.", "Procure palavras conhecidas, cognatos e marcadores de tempo.", "Yesterday, last week e ago costumam indicar passado."], "hack": "Primeiro entenda a ideia geral, depois os detalhes.", "example": "Yesterday I played soccer. A palavra yesterday ajuda a localizar a ação no passado."}], "qs": [["Qual frase está correta?", ["She visit her aunt yesterday.", "She visited her aunt yesterday.", "She did visited her aunt.", "She visits yesterday."], 1, "No afirmativo, visit vira visited."], ["Qual pergunta está correta?", ["Did you played soccer?", "Did you play soccer?", "Do you played soccer?", "Were you play soccer?"], 1, "Depois de did, use play na forma base."], ["Qual negativa está correta?", ["He didn't watched TV.", "He didn't watch TV.", "He not watched TV.", "He doesn't watched TV."], 1, "Depois de didn't, o verbo fica na forma base."]], "open": ["Escreva uma afirmativa, uma negativa e uma pergunta no Simple Past sobre ontem."]}, "Arte": {"icon": "🎨", "color": "#d07a35", "lessons": [{"title": "Leitura de imagens", "visual": "art", "steps": ["Ao observar uma obra, primeiro descreva o que realmente vê.", "Cor, linha, forma, textura e composição são elementos da linguagem visual.", "Depois da descrição, interprete possíveis sentidos usando evidências da obra."], "hack": "Primeiro DESCREVA. Depois INTERPRETE.", "example": "Descrição: há linhas curvas e cores escuras. Interpretação: esses elementos podem criar sensação de movimento ou tensão."}], "qs": [["Qual é elemento da linguagem visual?", ["Cor", "Verbo", "Equação", "Denominador"], 0, "Cor é um elemento visual."], ["Descrição e interpretação diferem porque:", ["Descrição observa; interpretação propõe sentidos", "São sempre iguais", "Descrição inventa; interpretação só lista", "Interpretação ignora a obra"], 0, "Primeiro observamos; depois construímos sentidos apoiados no que vemos."]], "open": ["Escolha uma imagem estudada e escreva uma descrição e uma interpretação separadamente."]}}; let current=null,li=0,si=0,pool=[],qi=0,score=0;

function stopVoice(){try{speechSynthesis.cancel()}catch(e){}}
function scoreVoice(v){
 const n=(v.name||'').toLowerCase(),l=(v.lang||'').toLowerCase();let x=0;
 if(l==='pt-br')x+=100;else if(l.startsWith('pt'))x+=60;
 if(/premium|enhanced|aprimorada|natural|neural/.test(n))x+=35;
 if(/luciana|francisca|eloquence|siri/.test(n))x+=20;
 if(/brazil|brasil|portugu/.test(n))x+=10;if(v.localService)x+=5;return x;
}
function chooseBrazilianVoice(){
 if(!('speechSynthesis'in window))return null;
 let a=(speechSynthesis.getVoices()||[]).filter(v=>(v.lang||'').toLowerCase().startsWith('pt'));
 if(!a.length)return null;a.sort((a,b)=>scoreVoice(b)-scoreVoice(a));selectedVoice=a[0];return selectedVoice;
}
function prepareVoice(){
 chooseBrazilianVoice();
 if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=chooseBrazilianVoice;
 setTimeout(chooseBrazilianVoice,250);setTimeout(chooseBrazilianVoice,1000);
}
prepareVoice();
function normalizeForSpeech(t){
 return String(t).replace(/\bHQ\b/g,'história em quadrinhos')
 .replace(/\bSNC\b/g,'sistema nervoso central').replace(/\bSNP\b/g,'sistema nervoso periférico')
 .replace(/(\d+)\s*%/g,'$1 por cento').replace(/½/g,'um meio').replace(/⅓/g,'um terço').replace(/¼/g,'um quarto');
}
function speak(t){
 stopVoice();if(!('speechSynthesis'in window))return;
 const voice=chooseBrazilianVoice(),clean=normalizeForSpeech(t);
 const parts=clean.match(/[^.!?;:]+[.!?;:]?/g)||[clean];let i=0;
 function go(){if(i>=parts.length)return;const phrase=parts[i++].trim();if(!phrase){go();return}
  const u=new SpeechSynthesisUtterance(phrase);u.lang=(voice&&voice.lang)||'pt-BR';if(voice)u.voice=voice;
  u.rate=.88;u.pitch=1;u.volume=1;u.onend=()=>setTimeout(go,180);u.onerror=()=>setTimeout(go,120);
  speechSynthesis.speak(u);
 }go();
}
function home(){let b=$('subjects');b.innerHTML='';Object.entries(DATA).forEach(([n,d])=>{let p=prog[n]||0;b.innerHTML+=`<div class="card subject"><div><div class="ico">${d.icon}</div><span class="pill">${n}</span><h3>${p>=80?'Dominado 🌟':p?'Em progresso':'Nova missão'}</h3><div class="progress"><div class="bar" style="width:${p}%"></div></div><small>${p}% melhor resultado</small></div><button data-sub="${n}">Estudar</button></div>`});b.querySelectorAll('[data-sub]').forEach(x=>x.onclick=()=>openSub(x.dataset.sub))}
function visual(type,step){if(type==='fraction')return `<div>${Array.from({length:20},(_,i)=>`<i class="choc" style="display:inline-block;animation-delay:${i*.025}s"></i>`).join(' ')}</div>`;
if(type==='percent')return `<div class="big">½ = 0,5 = 50%</div>`; if(type==='prob')return `<div class="node">👕 👕 👕</div><div class="arrow">×</div><div class="node">🩳 🩳</div><div class="arrow">=</div><div class="node">6 combinações</div>`;
if(type==='area'||type==='polygon')return `<div class="node">📏 PERÍMETRO<br>↻ borda</div><div class="node">🟩 ÁREA<br>superfície</div>`;
if(type.startsWith('rome'))return `<div class="node">👑 Monarquia</div><div class="arrow">→</div><div class="node">🏛️ República</div><div class="arrow">→</div><div class="node">🦅 Império</div>`;
if(type==='brain')return `<div class="big">🧠</div><div class="node">SNC<br>encéfalo + medula</div><div class="node">SNP<br>nervos + gânglios</div>`;
if(type==='reflex')return `<div class="node">🔥 estímulo</div><div class="arrow">→</div><div class="node">📡 aferente</div><div class="arrow">→</div><div class="node">🧠 medula</div><div class="arrow">→</div><div class="node">⚡ eferente</div><div class="arrow">→</div><div class="node">✋ resposta</div>`;
if(type==='neuron')return `<div class="big">⚡</div><div class="node">neurônio</div><div class="arrow">⇢</div><div class="node">sinapse</div><div class="arrow">⇢</div><div class="node">neurônio</div>`;
if(type==='story')return `<div class="node">📖 narrador</div><div class="node">🧍 personagens</div><div class="node">⏰ tempo</div><div class="node">🏞️ espaço</div>`;
if(type==='comic')return `<div class="big">💬</div><div class="node">“TOC TOC!”</div><div class="big">😮</div>`; if(type==='news')return `<div class="node">📰 TÍTULO</div><div class="node">LIDE<br>o quê? quem? quando? onde?</div>`;
if(type==='detective')return `<div class="big">🔎</div><div class="node">explícito = escrito</div><div class="arrow">+</div><div class="node">pistas = inferência</div>`;
if(type==='forest')return `<div class="tree">🌳🌿🦋</div><div class="node">clima + solo + relevo + água</div>`; if(type==='deforest')return `<div class="tree">🌳</div><div class="arrow">→</div><div class="big">🪵</div><div class="arrow">→</div><div class="node">solo exposto</div>`;
if(type==='english')return `<div class="node">Yesterday</div><div class="arrow">→</div><div class="node">I played ⚽</div>`; if(type==='reading')return `<div class="big">📚</div><div class="node">ideia geral → pistas → detalhes</div>`;
if(type==='art')return `<div class="big">🎨</div><div class="node">cor • linha • forma • textura</div>`;return `<div class="big">✨</div>`}
function openSub(n){current=n;li=0;si=0;show('study');renderLesson()}
function renderLesson(){let d=DATA[current],l=d.lessons[li],text=l.steps[si];$('study').innerHTML=`<div class="top"><button class="ghost" id="back">← Matérias</button><span class="pill">${d.icon} ${current}</span></div><div class="lessonlist">${d.lessons.map((x,i)=>`<button class="${i===li?'active':''}" data-li="${i}">${i+1}. ${x.title}</button>`).join('')}</div><div class="card"><h2>${l.title}</h2><div class="stage"><div class="teacher"><div class="avatar">👩‍🏫</div><div class="bubble">${text}</div></div><div class="scene">${visual(l.visual,si)}</div></div><div class="controls"><button class="ghost" id="prev">← Anterior</button><button id="repeat">🔁 Não entendi, explicar de novo</button><button id="next">${si<l.steps.length-1?'Próximo →':'Concluir aula ✓'}</button></div>${si===l.steps.length-1?`<div class="hack">🧠 <b>Macete, agora que você entendeu:</b> ${l.hack}</div><div class="example">✏️ <b>Exemplo:</b> ${l.example}</div>`:''}</div><div class="card" style="margin-top:12px"><button id="quizBtn">🧩 Fazer exercícios</button> <button class="gold" id="openBtn">✍️ Dissertativas</button> <button id="mockBtn" style="margin-top:8px">📝 Simulado Final de ${current}</button></div>`;
$('back').onclick=()=>{show('home');home()};$('repeat').onclick=()=>speak(text);$('prev').onclick=()=>{if(si>0)si--;else if(li>0){li--;si=DATA[current].lessons[li].steps.length-1}renderLesson()};$('next').onclick=()=>{if(si<l.steps.length-1)si++;else if(li<d.lessons.length-1){li++;si=0}else{si=l.steps.length-1}renderLesson()};$('quizBtn').onclick=()=>startQuiz();$('openBtn').onclick=openQuestions;$('mockBtn').onclick=()=>startSubjectMock(current);$('study').querySelectorAll('[data-li]').forEach(x=>x.onclick=()=>{li=+x.dataset.li;si=0;renderLesson()});setTimeout(()=>speak(text),380)}
function startQuiz(custom){let qs=custom||DATA[current].qs;pool=qs.map((q,i)=>({q,sub:current,id:i}));qi=0;score=0;show('quiz');renderQ()}
function renderQ(){if(qi>=pool.length)return finish();let it=pool[qi],q=it.q;$('quiz').innerHTML=`<div class="top"><button class="ghost" id="exit">← Sair</button><span class="pill">Questão ${qi+1}/${pool.length}</span></div><div class="card"><div class="q">${q[0]}</div><div class="opts">${q[1].map((o,i)=>`<button class="opt" data-i="${i}">${String.fromCharCode(65+i)}) ${o}</button>`).join('')}</div><div id="fb"></div></div>`;$('exit').onclick=()=>{show('home');home()};$('quiz').querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i))}
function answer(i){let it=pool[qi],q=it.q,bs=[...$('quiz').querySelectorAll('.opt')];bs.forEach(b=>b.disabled=true);if(i===q[2]){score++;bs[i].classList.add('ok');$('fb').innerHTML=`<div class="feedback">✅ Isso! ${q[3]}<br><button id="cont" style="margin-top:8px">Continuar →</button></div>`}else{bs[i].classList.add('bad');$('fb').innerHTML=`<div class="feedback">💡 Ainda não. Pense nesta pista: ${q[3]}<br><button id="retry" style="margin-top:8px">Tentar novamente</button></div>`;errors.push({sub:it.sub,q:q});localStorage.setItem('p6err',JSON.stringify(errors.slice(-80)));$('retry').onclick=()=>renderQ();return}$('cont').onclick=()=>{qi++;renderQ()}}
function finish(){let pct=Math.round(score/pool.length*100);if(current){prog[current]=Math.max(prog[current]||0,pct);localStorage.setItem('p6prog2',JSON.stringify(prog))};$('quiz').innerHTML=`<div class="card"><div class="score">${score}/${pool.length}</div><h2>${pct>=80?'Missão dominada 🌟':'Boa tentativa. Vamos reforçar os pontos difíceis. 🧠'}</h2><p>${pct}% de acertos</p><button id="homeBtn">Voltar</button></div>`;$('homeBtn').onclick=()=>{show('home');home()}}

function startSubjectMock(sub){
 current=sub; const m=MOCKS[sub]; if(!m){alert('Simulado ainda não disponível.');return}
 window.mockState={sub,phase:'obj',answers:[],written:Array(m.open.length).fill('')};
 show('quiz'); renderMockObj(0);
}
function renderMockObj(n){
 const st=window.mockState,m=MOCKS[st.sub],q=m.obj[n];
 $('quiz').innerHTML=`<div class="top"><button class="ghost" id="exitMock">← Sair</button><span class="pill">📝 ${st.sub} • Objetiva ${n+1}/14</span></div>
 <div class="card"><h2>Simulado Final</h2><p><b>Sem dicas durante a prova.</b> Leia com calma e marque uma alternativa.</p>
 <div class="q">${q[0]}</div><div class="opts">${q[1].map((o,i)=>`<button class="opt" data-mi="${i}">${String.fromCharCode(65+i)}) ${o}</button>`).join('')}</div></div>`;
 $('exitMock').onclick=()=>{show('study');renderLesson()};
 $('quiz').querySelectorAll('[data-mi]').forEach(b=>b.onclick=()=>{st.answers[n]=+b.dataset.mi;if(n<13)renderMockObj(n+1);else renderMockWritten(0)});
}
function renderMockWritten(n){
 const st=window.mockState,m=MOCKS[st.sub];
 $('quiz').innerHTML=`<div class="top"><button class="ghost" id="backObj">← Anterior</button><span class="pill">✍️ ${st.sub} • Dissertativa ${n+1}/6</span></div>
 <div class="card"><h2>Explique o raciocínio</h2><p>Responda com suas palavras. Não precisa decorar.</p>
 <div class="q">${m.open[n]}</div><textarea id="mockText" style="width:100%;min-height:150px;font-size:16px;padding:12px;border-radius:12px;border:1px solid #bbb" placeholder="Escreva sua resposta aqui...">${st.written[n]||''}</textarea>
 <div class="controls"><button id="nextWritten">${n<5?'Próxima →':'Finalizar simulado ✓'}</button></div></div>`;
 $('backObj').onclick=()=>{st.written[n]=$('mockText').value;if(n>0)renderMockWritten(n-1);else renderMockObj(13)};
 $('nextWritten').onclick=()=>{st.written[n]=$('mockText').value;if(n<5)renderMockWritten(n+1);else finishSubjectMock()};
}
function finishSubjectMock(){
 const st=window.mockState,m=MOCKS[st.sub];
 let correct=0;m.obj.forEach((q,i)=>{if(st.answers[i]===q[2])correct++});
 const pct=Math.round(correct/14*100);
 prog[st.sub]=Math.max(prog[st.sub]||0,pct);localStorage.setItem('p6prog2',JSON.stringify(prog));
 const review=m.obj.map((q,i)=>`<div class="hack" style="margin:10px 0"><b>${i+1}. ${st.answers[i]===q[2]?'✅':'❌'} ${q[0]}</b><br>Resposta: ${String.fromCharCode(65+q[2])}) ${q[1][q[2]]}<br><small>${q[3]}</small></div>`).join('');
 const written=m.open.map((q,i)=>`<div class="example" style="margin:10px 0"><b>Dissertativa ${i+1}:</b> ${q}<br><b>Resposta da Maria:</b> ${st.written[i]||'<i>não respondida</i>'}</div>`).join('');
 $('quiz').innerHTML=`<div class="top"><button class="ghost" id="mockHome">← Matéria</button><span class="pill">Resultado • ${st.sub}</span></div>
 <div class="card"><div class="score">${correct}/14</div><h2>Parte objetiva: ${pct}%</h2><p>As 6 dissertativas ficam abaixo para revisão com um adulto/professor. Primeiro veja onde houve erro, depois revise a aula correspondente.</p></div>
 <div class="card" style="margin-top:12px"><h2>Correção das objetivas</h2>${review}</div>
 <div class="card" style="margin-top:12px"><h2>Respostas dissertativas</h2>${written}</div>`;
 $('mockHome').onclick=()=>{show('study');renderLesson()};
}
function openQuestions(){let d=DATA[current];$('study').innerHTML=`<div class="top"><button class="ghost" id="ob">← Aula</button><span class="pill">✍️ ${current}</span></div><div class="card"><h2>Explique com suas palavras</h2><p>Não precisa decorar. Tente explicar o raciocínio.</p>${d.open.map((q,i)=>`<div class="hack"><b>${i+1}. ${q}</b><textarea placeholder="Escreva aqui..."></textarea></div>`).join('')}</div>`;$('ob').onclick=renderLesson}
$('review').onclick=()=>{if(!errors.length){alert('Ainda não há erros salvos.');return}current=null;pool=errors.slice(-12).map((e,i)=>({q:e.q,sub:e.sub,id:i}));qi=0;score=0;show('quiz');renderQ()};home();
</script></body></html>
